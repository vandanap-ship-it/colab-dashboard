name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Postgres for CI. Same engine as prod (Neon), so tests catch any
      # Postgres-specific behaviour. The credentials are local to the runner.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siddhi
          POSTGRES_PASSWORD: test
          POSTGRES_DB: siddhi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siddhi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local Postgres on the runner. No production credentials involved.
      DATABASE_URL: "postgresql://siddhi:test@localhost:5432/siddhi"
      AUTH_SECRET: "ci-test-secret-not-used-in-production"
      NODE_ENV: "test"
      # Explicit opt-in for the seed scripts. Both refuse to run without
      # these flags — the guard exists so a developer can't accidentally
      # drop weak-password accounts into a shared / production database.
      # CI is a fresh local Postgres, so opting in here is safe.
      ALLOW_SEED: "yes"
      ALLOW_DEMO_SEED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Schema drift check (schema.prisma vs committed SQL snapshot)
        run: npm run schema:check

      - name: Set up test database
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts
          npx tsx prisma/demo-seed.ts

      - name: Unit tests
        run: npm run test:unit

      - name: Build (typechecks + generates route types)
        run: npx next build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: Nightly DB backup

# Runs every day at 20:30 UTC = 02:00 IST (early morning India time, off-peak).
# Also supports manual trigger from the Actions tab.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo (for scripts/verify-backup.ts)
        uses: actions/checkout@v4

      - name: Install postgresql-client matching Neon's server version
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          # Add pgdg apt repo — official Postgres client packages, all major versions.
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          # Neon is on Postgres 18.6 as of Sep 2026. pg_dump refuses to run against
          # a newer server, so we track Neon's version explicitly. If they bump
          # to 19, this step + docs/backup-restore.md need to bump together.
          sudo apt-get install -y postgresql-client-18
          # `pg_dump` on Ubuntu is a wrapper (pg_wrapper) that dispatches to the
          # "default" cluster's binary — which stays on v16 even after we
          # install v18 alongside. Use the explicit path so the right binary
          # runs regardless of what apt considers "default".
          PG_DUMP=/usr/lib/postgresql/18/bin/pg_dump
          if [ ! -x "$PG_DUMP" ]; then
            echo "::error::Expected pg_dump v18 at $PG_DUMP but it isn't executable."
            ls -la /usr/lib/postgresql/ || true
            exit 1
          fi
          echo "PG_DUMP=$PG_DUMP" >> $GITHUB_ENV
          echo "pg_dump v18 version:"
          "$PG_DUMP" --version

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # -e alone doesn't catch pipeline failures. Without pipefail,
          # `pg_dump | gzip` returned 0 when pg_dump aborted mid-stream,
          # leaving an "empty-gzip" 20-byte file the workflow called success.
          # This was live in prod for 10+ days before we caught it.
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set on the repo."
            exit 1
          fi
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H-%M-%SZ')
          FILENAME="siddhi-backup-${TIMESTAMP}.sql.gz"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV
          # --no-owner + --no-acl → portable dump, no role assumptions.
          # --format=plain + gzip → simple, greppable, small.
          "$PG_DUMP" "$DATABASE_URL" --no-owner --no-acl --format=plain \
            | gzip -9 > "$FILENAME"
          BYTES=$(stat -c%s "$FILENAME")
          SIZE=$(du -h "$FILENAME" | cut -f1)
          echo "Backup created: $FILENAME ($SIZE, ${BYTES} bytes)"
          # Sanity floor — an empty gzip is 20 bytes. Even an empty schema-only
          # dump is > 2 KB. If we ever see less than 1 KB, something broke.
          if [ "$BYTES" -lt 1024 ]; then
            echo "::error::Backup file suspiciously small (${BYTES} bytes) — pg_dump likely aborted mid-stream. Failing loudly instead of shipping garbage."
            exit 1
          fi
          echo "BACKUP_SIZE=${SIZE}" >> $GITHUB_ENV

      - name: Set up Node (for @vercel/blob SDK)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upload to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::warning::BLOB_READ_WRITE_TOKEN not set — skipping Blob upload. Backup file is in the workflow artifacts instead."
            exit 0
          fi
          # Use @vercel/blob's put() rather than raw HTTP — the SDK reads the
          # target store's access config from the token and picks the right
          # upload flow. Raw HTTP was fighting us on Private stores: no header
          # or query param combination we tried was accepted (documented API
          # kept returning "Cannot use public access on a private store").
          # Path convention: backups/YYYY-MM/filename.sql.gz — groups by month
          # for easy pruning.
          # NB: BLOB_PATH, not PATH — assigning to $PATH would nuke the shell's
          # binary search path (curl, node) and error with "command not found".
          MONTH=$(date -u +'%Y-%m')
          # Must `export` so the node subprocess inherits these — the local
          # BLOB_PATH= assignment stays in the shell without export.
          export BLOB_PATH="backups/${MONTH}/${BACKUP_FILE}"
          export BACKUP_FILE
          npm install --silent --no-save --prefix /tmp/blob-uploader @vercel/blob
          # put() returns both `url` (raw storage URL — 403s on a private
          # store without auth) and `downloadUrl` (signed URL that works
          # for the recipient without needing our token). The email needs
          # the SIGNED one; the raw url is what the earlier version shipped,
          # and every recipient (including Shraddha + Vandana) saw
          # "forbidden" when they clicked it. Keep url in BLOB_URL for the
          # workflow summary + verify-backup logs, and ship downloadUrl in
          # BLOB_DOWNLOAD_URL for the email body.
          BLOB_JSON=$(node -e "
            const { put } = require('/tmp/blob-uploader/node_modules/@vercel/blob');
            const fs = require('fs');
            (async () => {
              try {
                const buf = fs.readFileSync(process.env.BACKUP_FILE);
                // access must match the store's config; store is Private, so
                // any file-level access:'public' is rejected. Older SDK
                // versions require the option — pass 'public' for public
                // stores, 'private' for private ones (this store).
                const result = await put(process.env.BLOB_PATH, buf, {
                  access: 'private',
                  addRandomSuffix: false,
                  contentType: 'application/gzip',
                  token: process.env.BLOB_READ_WRITE_TOKEN,
                });
                console.log(JSON.stringify({ url: result.url, downloadUrl: result.downloadUrl }));
              } catch (e) {
                console.error(e.message);
                process.exit(1);
              }
            })();
          ")
          BLOB_URL=$(echo "$BLOB_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['url'])")
          BLOB_DOWNLOAD_URL=$(echo "$BLOB_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('downloadUrl') or d['url'])")
          echo "BLOB_URL=${BLOB_URL}" >> $GITHUB_ENV
          echo "BLOB_DOWNLOAD_URL=${BLOB_DOWNLOAD_URL}" >> $GITHUB_ENV
          echo "Uploaded to: ${BLOB_URL}"
          echo "Recipient download URL (signed): ${BLOB_DOWNLOAD_URL}"

      - name: Upload workflow artifact (fallback + audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Verify backup contents (list + parse newest Blob)
        # Runs AFTER upload so it reads the file the way a restore would —
        # from Blob, not from the local pg_dump output. Catches the failure
        # mode from August 2026 where empty gzips uploaded nightly and
        # nobody noticed for 10 days.
        if: env.BLOB_URL != ''
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          # Install just what the verifier needs — @vercel/blob + tsx.
          # Skips the full npm ci to keep the workflow fast; the verifier
          # script only pulls those two deps. NODE_PATH tells node where to
          # resolve `@vercel/blob` when the script has no local node_modules.
          npm install --silent --no-save --prefix /tmp/backup-verify @vercel/blob tsx
          NODE_PATH=/tmp/backup-verify/node_modules \
            /tmp/backup-verify/node_modules/.bin/tsx scripts/verify-backup.ts

      - name: Notify by email (Resend)
        if: env.BLOB_URL != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_EMAIL_RECIPIENTS: ${{ secrets.BACKUP_EMAIL_RECIPIENTS }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY not set — skipping email digest. Backup is at ${BLOB_URL}"
            exit 0
          fi
          export RECIPIENTS=${BACKUP_EMAIL_RECIPIENTS:-"vandana.p@whitelotusgroup.in,shraddha.b@whitelotusgroup.in"}
          export RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The .sql.gz is attached inline (typical size ~2 MB, well under
          # Resend's 40 MB per-email limit). No download click needed. The
          # earlier version linked to the private-Blob URL, which 403s
          # without the workspace token — the whole reason Shraddha +
          # Vandana couldn't open the backup.
          #
          # Building the JSON body via a standalone Python script (written
          # to /tmp) avoids heredoc + YAML indentation hell. The script
          # reads env vars set above and prints the JSON payload for curl.
          cat > /tmp/build-backup-email.py <<'PYSCRIPT'
          import base64
          import json
          import os
          import pathlib
          import sys

          recipients = [e.strip() for e in os.environ["RECIPIENTS"].split(",") if e.strip()]
          fname = os.environ["BACKUP_FILE"]
          size = os.environ["BACKUP_SIZE"]
          run_url = os.environ["RUN_URL"]

          html = (
              "<p>Nightly backup complete &mdash; the <b>.sql.gz is attached</b> to this email.</p>"
              f"<p><b>File:</b> {fname}<br><b>Size:</b> {size}</p>"
              "<p>The file is a plain gzipped pg_dump; unzip and restore into any Postgres 18 instance with <code>psql</code>.</p>"
              f"<p>Older backups: sign in to the <a href=\"{run_url}\">GitHub Actions run</a> "
              "(Vandana + Shraddha both have repo access) and download from the Artifacts section, "
              "or use the Vercel dashboard's Blob store.</p>"
          )

          data = base64.b64encode(pathlib.Path(fname).read_bytes()).decode("ascii")
          payload = {
              "from": "Siddhi Backups <backups@whitelotusgroup.in>",
              "to": recipients,
              "subject": f"Siddhi backup ready — {fname} ({size})",
              "html": html,
              "attachments": [{"filename": fname, "content": data}],
          }
          sys.stdout.write(json.dumps(payload))
          PYSCRIPT
          BODY=$(python3 /tmp/build-backup-email.py)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.resend.com/emails" \
            -H "authorization: Bearer $RESEND_API_KEY" \
            -H "content-type: application/json" \
            --data "$BODY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Email dispatch failed with HTTP $HTTP_CODE (backup itself succeeded)."
            echo "Body head: $(echo "$RESPONSE" | head -3)"
          else
            echo "Email sent to ${RECIPIENTS} with attachment (${BACKUP_SIZE})"
          fi

      - name: Notify by email on FAILURE (Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_EMAIL_RECIPIENTS: ${{ secrets.BACKUP_EMAIL_RECIPIENTS }}
        # Fires only when a prior step failed. Success emails are already
        # sent by the "Notify by email (Resend)" step above. This step is
        # our loudest signal that backups broke — the whole reason we
        # discovered the 10-day silent break was because nobody read
        # GitHub's built-in failure notifications. An addressed email
        # in the same inbox as the success digest is much harder to miss.
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY not set — skipping failure email. Check the run logs manually."
            exit 0
          fi
          RECIPIENTS=${BACKUP_EMAIL_RECIPIENTS:-"vandana.p@whitelotusgroup.in,shraddha.b@whitelotusgroup.in"}
          TO_JSON=$(echo "$RECIPIENTS" | python3 -c "import json,sys; print(json.dumps([e.strip() for e in sys.stdin.read().split(',')]))")
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.resend.com/emails" \
            -H "authorization: Bearer $RESEND_API_KEY" \
            -H "content-type: application/json" \
            -d "{
              \"from\": \"Siddhi Backups <backups@whitelotusgroup.in>\",
              \"to\": ${TO_JSON},
              \"subject\": \"🚨 Siddhi backup FAILED — check now\",
              \"html\": \"<p><b>Nightly backup did not complete.</b></p><p>Every hour past this failure is an hour of data we can't restore. Investigate before the next scheduled run at 02:00 IST.</p><p><b>Run:</b> <a href=\\\"${RUN_URL}\\\">${RUN_URL}</a></p><p>Common causes: DATABASE_URL secret missing/rotated, Neon Postgres version bump breaking pg_dump, BLOB_READ_WRITE_TOKEN expired.</p>\"
            }" || true

      - name: Summary
        if: always()
        run: |
          echo "## Backup summary" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`${BACKUP_FILE:-not-produced}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** ${BACKUP_SIZE:-n/a}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$BLOB_URL" ]; then
            echo "- **Blob:** ${BLOB_URL}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Blob:** upload skipped (see logs)" >> $GITHUB_STEP_SUMMARY
          fi
